name: Build and Publish Windows App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Publish Windows x64
      run: dotnet publish src/BambiHeavy/BambiHeavy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BambiHeavy-win-x64
        path: ./publish/
        if-no-files-found: error
